<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB-Pay</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#1e293b;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h1{color:#38bdf8;margin:0}
input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;outline:none;font-size:16px}
button{width:100%;padding:12px;background:#38bdf8;color:#000;font-weight:bold;border:none;border-radius:10px;font-size:18px;margin-top:10px}
.success{color:#4ade80;margin-top:15px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>MB-Pay</h1>
<p>Fast & Secure Payment</p>
<input type="text" id="name" placeholder="Apna Naam">
<input type="number" id="amount" placeholder="Amount ₹">
<button onclick="pay()">Pay Now</button>
<div class="success" id="msg">✅ Payment Successful!</div>
</div>
<script>
function pay(){
 let n=document.getElementById('name').value;
 let a=document.getElementById('amount').value;
 if(n==""||a==""){alert("Naam aur Amount bharo");return;}
 document.getElementById('msg').style.display='block';
}
</script>
</body>
</html>
