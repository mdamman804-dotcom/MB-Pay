<!DOCTYPE html>
<html>
<head>
  <meta name="monetag" content="e6e17421f36e0a12ae721dfb4aff22bb">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB PAY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0a1e;color:white;padding-bottom:80px}
.header{display:flex;justify-content:space-between;padding:18px 20px}
.logo{font-size:26px;font-weight:800;color:#a78bfa}
.balance-card{background:linear-gradient(135deg,#6d28d9,#4c1d95);margin:10px 16px;border-radius:24px;padding:22px}
.balance-value{font-size:36px;font-weight:800;margin:10px 0}
.watch-btn{width:100%;background:#a78bfa;color:white;border:none;padding:16px;border-radius:14px;font-size:18px;font-weight:700}
.warning{text-align:center;color:#fbbf24;font-size:13px;margin-top:12px}
.card{background:#1e1640;border-radius:18px;padding:18px;text-align:center;margin:10px}
</style>
</head>
<body>
<div class="header"><div class="logo">MB PAY</div><div>🔔 👤</div></div>
<div class="balance-card">
<div>Current Balance</div>
<div class="balance-value" id="bal">0.000 GB</div>
<div>Rate: 1GB = Rs 10</div><br>
<button class="watch-btn" id="btn" onclick="watchAd()">▶ Watch Ad +0.100 GB</button>
<div class="warning">Chrome Data Clear Mat Karo</div>
</div>
<div class="card"><p>Total Ad Earning</p><h3>Rs 2340</h3></div>
<div class="card"><p>Total Paid</p><h3>Rs 1100</h3></div>

<script>
let gb = parseFloat(localStorage.getItem('mbpay_gb')||'0');
document.getElementById('bal').innerText = gb.toFixed(3)+' GB';

function watchAd(){
  let btn = document.getElementById('btn');
  btn.innerText = 'Ad Loading 5s...';
  btn.disabled = true;
  // Monetag ka ad yaha khulega
  window.open('https://www.google.com','_blank');
  let c=5;
  let t=setInterval(()=>{
    c--;
    if(c>0) btn.innerText='Wait '+c+'s...';
    else{
      clearInterval(t);
      gb+=0.100;
      localStorage.setItem('mbpay_gb',gb);
      document.getElementById('bal').innerText=gb.toFixed(3)+' GB';
      btn.innerText='▶ Watch Ad +0.100 GB';
      btn.disabled=false;
      alert('0.100 GB Added!');
    }
  },1000);
}
</script>
</body>
</html>
