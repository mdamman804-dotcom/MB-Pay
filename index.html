<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MB PAY - Earn Data</title>

<!-- MONETAG KA SCRIPT YAHAN AAYEGA, ABHI KHALI HAI -->
<script id="monetag-script"></script>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-top:20px}
button{padding:15px;width:100%;background:#22c55e;color:black;font-weight:bold;border:none;border-radius:10px;font-size:18px;margin-top:10px}
#bal{font-size:40px;color:#22c55e}
</style>
</head>
<body>

<h2>MB PAY</h2>
<div class="card">
  <p>Your Data Balance</p>
  <div id="bal">0.000 GB</div>
  <p id="rupees">₹0.00</p>
</div>

<div class="card">
  <button onclick="watchAd()">Watch Ad & Earn 0.100 GB</button>
  <button onclick="withdraw()" style="background:#3b82f6;color:white">Withdraw</button>
</div>

<script>
let bal = 0;
function updateAll(){
  document.getElementById('bal').innerText = bal.toFixed(3) + " GB";
  document.getElementById('rupees').innerText = "₹" + (bal*10).toFixed(2);
}
function watchAd(){
  // Jab Monetag ka code aayega, yahan ad dikhega
  if(typeof show_1234567 === 'function'){
     show_1234567().then(()=>{
        bal += 0.100;
        updateAll();
        alert("Ad dekha! 0.100 GB mil gaya");
     })
  } else {
     // Abhi testing ke liye bina ad ke hi balance badh raha hai
     bal += 0.100;
     updateAll();
     alert("Testing: 0.100 GB mil gaya (Monetag lagne ke baad ad dikhega)");
  }
}
function withdraw(){
  if(bal < 1.0){
    alert("Minimum 1 GB hona chahiye withdraw ke liye");
  } else {
    alert("Withdraw Request: " + bal.toFixed(3) + " GB");
  }
}
</script>

</body>
</html>
