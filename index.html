<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB-Pay Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f3ff}
.header{background:#5b21b6;color:#fff;padding:15px;display:flex;justify-content:space-between}
.bal-card{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;margin:15px;padding:20px;border-radius:20px}
.bal-card h1{font-size:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.btn{background:#fff;padding:18px;border-radius:15px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.05);cursor:pointer;font-weight:700}
.task-box{background:#fff;margin:15px;padding:20px;border-radius:15px;text-align:center}
.watch-btn{background:#22c55e;color:#fff;padding:15px;border:none;border-radius:50px;font-size:18px;font-weight:800;width:100%;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}
.page{display:none;padding-bottom:80px}.active{display:block}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
</style></head>
<body>
<div class="header"><b>MB-Pay Premium</b><div><span onclick="openPage('notif')">🔔</span> <span onclick="openPage('profile')">👤</span></div></div>

<div id="home" class="page active">
<div class="bal-card"><p>Total Balance</p><h1>₹ <span id="balance">0</span></h1><p>Ads: <span id="count">0</span></p></div>
<div class="task-box"><h3>Ads Dekho Paisa Lo</h3><br><p>1 Ad = ₹10</p><br><button class="watch-btn" onclick="watchAd()">▶️ Watch Ad - Earn ₹10</button><p id="msg"></p></div>
<div class="grid"><div class="btn" onclick="openPage('deposit')">💰 Deposit</div><div class="btn" onclick="openPage('withdraw')">🏧 Withdraw</div><div class="btn" onclick="openPage('history')">📜 History</div><div class="btn" onclick="adminLogin()">🛡️ Admin</div></div>
</div>

<div id="deposit" class="page"><div style="padding:15px"><h2>Deposit</h2><input id="depAmt" placeholder="Amount"><button class="watch-btn" onclick="doDeposit()">Deposit Now</button><div id="qrArea"></div><button onclick="openPage('home')">Back</button></div></div>
<div id="withdraw" class="page"><div style="padding:15px"><h2>Withdraw</h2><input id="wAmt" placeholder="Min 100"><input id="wUpi" placeholder="UPI"><button class="watch-btn" style="background:#5b21b6" onclick="doWithdraw()">Withdraw</button><button onclick="openPage('home')">Back</button></div></div>
<div id="history" class="page"><div style="padding:15px"><h2>History</h2><div id="histList"></div><button onclick="openPage('home')">Back</button></div></div>
<div id="notif" class="page"><div style="padding:15px"><h2>Notification</h2><p>Roz 50 Ads dekh ke ₹500 kamao!</p><button onclick="openPage('home')">Back</button></div></div>
<div id="profile" class="page"><div style="padding:15px"><h2>Profile</h2><p>UPI: mdamman804@okhdfcbank</p><button onclick="openPage('home')">Back</button></div></div>
<div id="admin" class="page"><div style="padding:15px"><h2>Admin</h2><div id="adminData"></div><button onclick="openPage('home')">Back</button></div></div>

<div class="nav"><div onclick="openPage('home')">🏠 Home</div><div onclick="openPage('deposit')">💳 Cards</div><div onclick="openPage('withdraw')">💸 Pay</div><div onclick="openPage('profile')">👤 Profile</div></div>

<script>
let AD_LINK="https://www.omg10.com/4/1173189"; let UPI="mdamman804@okhdfcbank";
let bal=parseInt(localStorage.getItem('mb_bal')||0); let cnt=parseInt(localStorage.getItem('mb_cnt')||0);
let hist=JSON.parse(localStorage.getItem('mb_hist')||"[]"); let wReq=JSON.parse(localStorage.getItem('mb_w')||"[]");
document.getElementById('balance').innerText=bal; document.getElementById('count').innerText=cnt;
function openPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active'); if(p=='history')renderHist(); if(p=='admin')renderAdmin();}
function watchAd(){window.open(AD_LINK,'_blank'); setTimeout(()=>{bal+=10; cnt++; localStorage.setItem('mb_bal',bal); localStorage.setItem('mb_cnt',cnt); hist.push({t:'+ ₹10 Ad',time:new Date().toLocaleString()}); localStorage.setItem('mb_hist',JSON.stringify(hist)); document.getElementById('balance').innerText=bal; document.getElementById('count').innerText=cnt; document.getElementById('msg').innerText='₹10 Added!';},1500);}
function doDeposit(){let amt=document.getElementById('depAmt').value; window.open(AD_LINK,'_blank'); document.getElementById('qrArea').innerHTML=`<br><p>Pay to ${UPI}</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${UPI}&am=${amt}"><br><button class="watch-btn" onclick="confirmDep(${amt})">I Paid</button>`;}
function confirmDep(amt){bal+=parseInt(amt); localStorage.setItem('mb_bal',bal); alert('Added'); location.reload();}
function doWithdraw(){let amt=parseInt(document.getElementById('wAmt').value); let upi=document.getElementById('wUpi').value; if(amt>bal)return alert('Balance kam hai'); window.open(AD_LINK,'_blank'); bal-=amt; localStorage.setItem('mb_bal',bal); wReq.push({amt,upi,time:new Date().toLocaleString()}); localStorage.setItem('mb_w',JSON.stringify(wReq)); alert('Request Sent'); location.reload();}
function renderHist(){let h='';hist.slice().reverse().forEach(x=>{h+=`<div style="background:#fff;padding:10px;margin:5px;border-radius:10px">${x.t}<br><small>${x.time}</small></div>`}); document.getElementById('histList').innerHTML=h||'No History';}
function adminLogin(){let p=prompt('Pass?'); if(p=='amman123')openPage('admin');}
function renderAdmin(){let h='';wReq.reverse().forEach(x=>{h+=`<div style="background:#fff;padding:10px;margin:5px">${x.amt} -> ${x.upi}<br>${x.time}</div>`}); document.getElementById('adminData').innerHTML=h;}
</script></body></html>
